[project]
name = "sentra-sensor"
version = "0.7.0"
description = "Sentra distributed sensor: authorized network discovery inside a remote site"
requires-python = ">=3.12"
# Solo biblioteca estándar: menos superficie de ataque y despliegue trivial en sites remotos.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<1", "mypy>=2.4,<3"]
# Fase 6B: inventario SNMP de solo lectura (pysnmp BSD-2, pyasn1 BSD-2; cryptography
# Apache-2.0/BSD para AES de SNMPv3). Opcional: sin él el sensor no declara snmp.*.
snmp = ["pysnmp>=7.1,<8", "cryptography>=50,<51"]

[project.scripts]
sentra-sensor = "sentra_sensor.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentra_sensor*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]  # tokens y rutas falsos en tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sentra_sensor", "tests"]

# pysnmp y pyasn1 (extra opcional snmp) no publican tipos; solo los importa snmp/pysnmp_adapter.py.
[[tool.mypy.overrides]]
module = ["pysnmp.*", "pyasn1.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
