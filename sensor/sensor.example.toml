# Configuración del Sentra Sensor (copiar a /etc/sentra-sensor/sensor.toml o
# %ProgramData%\Sentra\Sensor\sensor.toml).
#
# Las redes que el sensor puede sondear NO se configuran aquí: las decide el servidor
# (redes habilitadas del Site) y llegan en cada heartbeat. Editar este fichero no amplía
# el alcance del sensor.

[sensor]
# URL pública del servidor Sentra. Solo https:// (http:// únicamente para 127.0.0.1/localhost
# en desarrollo). La verificación TLS no se puede desactivar.
server_url = "https://sentra.example.com"

# CA privada adicional (PEM) si el servidor usa un certificado de una CA interna.
# ca_bundle = "/etc/sentra-sensor/ca.pem"

# Directorio de datos (credencial, spool, estado, logs). Por defecto:
#   Linux (servicio): /var/lib/sentra-sensor    Windows: %ProgramData%\Sentra\Sensor
# data_dir = "/var/lib/sentra-sensor"

# Rutas relativas a data_dir (o absolutas DENTRO de data_dir; se rechaza '..').
credential_path = "credential.json"
spool_path = "spool.sqlite3"

# Valores iniciales; el servidor envía los efectivos en cada heartbeat.
poll_interval_seconds = 30
heartbeat_interval_seconds = 30

# Límites del spool durable (resultados pendientes de entregar si el servidor no responde).
spool_max_mb = 64
spool_max_items = 10000
spool_max_age_hours = 72

# Tope del backoff exponencial (con jitter) de los reintentos.
retry_max_delay_seconds = 300

log_level = "INFO"
# log_dir = "/var/log/sentra-sensor"

# Uso de binarios del sistema (argv fijo, sin shell). Desactívalos para ser más restrictivo
# que el servidor: sin ping no hay sondas ICMP; sin arp (Windows) no hay MAC.
allow_system_ping = true
allow_system_arp = true

# --- Fase 6E (sensor 0.6.0): leases DHCP de ficheros locales -----------------------------
# El servidor solo puede pedir una fuente por su NOMBRE (job dhcp_leases); nunca envía rutas.
# Sin entradas, el sensor no lee ningún fichero DHCP. Ver docs/sensor-upgrade-0.6.md.
# Tope de tamaño de cada fichero de leases, en KiB (1..65536). Va dentro de [sensor].
dhcp_max_file_kb = 4096

# Una tabla por fichero. name: ^[a-z0-9_-]{1,64}$ y único; path: absoluto; format: dnsmasq,
# isc_dhcpd, kea_csv, windows_dhcp_csv o generic_csv. Descomentar y adaptar:
#
# [[dhcp_lease_files]]
# name = "lan-dnsmasq"
# path = "/var/lib/misc/dnsmasq.leases"
# format = "dnsmasq"
#
# [[dhcp_lease_files]]
# name = "dc01-dhcp"
# path = "C:/ProgramData/Sentra/DhcpExport/leases.csv"
# format = "windows_dhcp_csv"

# --- Fase 7E (sensor 0.8.0): observación pasiva de red (NDR) -----------------------------
# Desactivada por defecto. Doble control: aquí se declaran las interfaces (alias -> dispositivo)
# y un admin de Sentra aprueba por ALIAS cuáles se capturan; el servidor nunca envía nombres de
# dispositivo, filtros BPF ni comandos. Solo lectura pasiva: sin inyección, sin descifrado TLS
# y sin guardar payloads (solo metadatos de flujos, ARP, DHCP y, si se aprueban, DNS/SNI).
# Requisitos: Linux CAP_NET_RAW (packaging/linux/sentra-sensor-ndr.conf); Windows Npcap
# instalado por el operador; macOS libpcap del sistema con acceso a /dev/bpf*.
# Comprobar con `sentra-sensor ndr-check`. Ver docs/fase-7e.md.
#
# [ndr]
# enabled = true
# backend = "auto"        # auto | af_packet | libpcap
# spool_max_mb = 256      # spool propio (ndr-spool.sqlite3), separado del de jobs
# buffer_kb = 4096        # búfer de recepción del socket AF_PACKET
#
# [[ndr.interfaces]]
# name = "lan"            # alias que ve el servidor: ^[a-z0-9_-]{1,32}$
# device = "eth1"         # Windows: \Device\NPF_{GUID} (ver `sentra-sensor ndr-check`)

# --- Fase 7F (sensor 0.9.0): receptores SIEM (Syslog) --------------------------------------
# Desactivados por defecto. Doble control como NDR: aquí se declaran las entradas (alias,
# protocolo, puerto, pares permitidos) y un admin de Sentra registra una fuente SIEM que apunta
# al ALIAS. Solo se escucha en entradas declaradas aquí Y habilitadas en el servidor; el
# servidor nunca envía puertos, direcciones, rutas ni certificados.
# Reglas fijas: UDP solo con allow_udp = true (la IP de origen UDP se falsifica y no autentica);
# sin TLS, allowed_peers solo puede contener rangos privados, de loopback o de enlace local.
# Ver docs/fase-7f-syslog.md.
#
# [siem]
# enabled = true
# spool_max_mb = 128      # spool propio (siem-spool.sqlite3), separado de jobs y NDR
#
# [[siem.inputs]]
# name = "fw-syslog"      # alias que ve el servidor: ^[a-z0-9_-]{1,32}$
# type = "syslog"
# protocol = "tls"        # tcp | tls | udp (udp exige allow_udp = true)
# bind = "0.0.0.0"
# port = 6514
# allowed_peers = ["10.0.10.1/32"]
# tls_cert = "/etc/sentra-sensor/syslog.crt"   # ruta absoluta local (Linux y macOS)
# tls_key = "/etc/sentra-sensor/syslog.key"
## Windows: ruta con letra de unidad (sin UNC); "/etc/..." no es absoluta en Windows y se
## rechaza. Usar "/" o "\\" en TOML:
## tls_cert = "C:/ProgramData/SentraSensor/syslog.crt"
## tls_key = "C:/ProgramData/SentraSensor/syslog.key"
# max_message_bytes = 8192
# max_connections = 32
# max_records_per_second = 2000
# idle_timeout_seconds = 300
#
# Fase 7F.3: lectura incremental de ficheros JSON Lines (Suricata eve.json, logs JSON de
# Zeek, alerts.json de Wazuh). Solo ficheros dentro de allowed_dir; nunca enlaces simbólicos
# ni junctions; offsets en siem-offsets.json; payloads de Suricata eliminados en el host.
#
# [[siem.inputs]]
# name = "suricata"
# type = "file"
# format = "suricata_eve"           # suricata_eve | zeek_json | wazuh_alerts | json_lines
# allowed_dir = "/var/log/suricata"
## Windows (ruta con letra de unidad, sin UNC):
## allowed_dir = "C:/Program Files/Suricata/log"
# paths = ["eve.json"]              # relativas a allowed_dir (como mucho 16)
# start_at = "end"                  # end | beginning (solo la primera vez, sin offset guardado)
# max_line_bytes = 65536
# max_records_per_second = 2000
# poll_interval_ms = 1000
