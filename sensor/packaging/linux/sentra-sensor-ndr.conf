# Drop-in OPCIONAL para la observación pasiva de red (NDR, fase 7E).
# Instalar solo si [ndr] enabled = true en sensor.toml:
#   install -D -m 0644 sentra-sensor-ndr.conf \
#     /etc/systemd/system/sentra-sensor.service.d/ndr.conf
#   systemctl daemon-reload && systemctl restart sentra-sensor
# Añade lo mínimo para leer tramas con AF_PACKET: CAP_NET_RAW y la familia AF_PACKET. El
# sensor no usa CAP_NET_ADMIN: el modo promiscuo lo pide el socket (PACKET_MR_PROMISC) solo
# si el servidor lo aprueba, y en un puerto SPAN/TAP no hace falta.
[Service]
CapabilityBoundingSet=CAP_NET_RAW
AmbientCapabilities=CAP_NET_RAW
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK AF_PACKET
