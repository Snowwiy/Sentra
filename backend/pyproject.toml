[project]
name = "sentra-backend"
version = "0.1.0"
description = "Sentra API: asset and security event monitoring platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "N", "RUF"]
ignore = ["B008"]  # FastAPI dependency injection uses calls in defaults

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is not a package

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Environment must be prepared before the app (and its cached settings) is imported.
"tests/conftest.py" = ["S101", "S105", "E402"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
