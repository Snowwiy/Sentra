[project]
name = "sentra-agent"
version = "0.1.0"
description = "Sentra endpoint agent: reports host inventory, heartbeat and telemetry"
requires-python = ">=3.12"
dependencies = ["psutil>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<1", "mypy>=2.4,<3", "types-psutil"]

[project.scripts]
sentra-agent = "sentra_agent.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentra_agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # fake tokens in tests

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
